# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: build&test nf.Tarantool 

on:
  push:
    branches: [ "main" ]
  # pull_request:
  #  branches: [ "main" ]

jobs:
  build:

    runs-on: windows-latest
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job

    steps:
    - uses: actions/checkout@v4 
      with:
        fetch-depth: 0
  
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64

    - name: .NET nanoFramework build components installer
      uses: nanoframework/nanobuild@v1.20

    - name: Cache nanoFramework NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
            ${{ runner.os }}-nuget-
            
    - uses: nuget/setup-nuget@v2
    
    - name: Restore nanoFramework NuGet packages
      run: |
          nuget restore nanoFramework.Tarantool.sln -UseLockFile
          nuget update nanoFramework.Tarantool.sln

    - name: Build
      run: msbuild /p:Configuration=Release /p:Platform="Any CPU"

    - name: nanoFramework Unit Tests
      uses: CCSWE-nanoFramework/vstest-nanoframework@v1.0.11
      with:
        runSettings: '.\NFUnitTest\nano.runsettings'
        artifactName: 'unit_test_results'
      
    #- name: .NET Unit Tests
    #  uses: microsoft/vstest-action@v1.0.0
    #  with: 
    #    testAssembly: Net.Tarantool.Tests.dll
    #    searchFolder: ./Net.Tarantool.Tests/bin/Release/net9.0/
    #    runInParallel: true

    - name: Generate a NuGet package
      run: nuget pack nanoFramework.Tarantool.nuspec -properties version="${{env.NBGV_NuGetPackageVersion}}" -properties commit="${{env.NBGV_GitCommitId}}"

       # Get a short-lived NuGet API key
    - name: Generate a NuGet key
      uses: NuGet/login@v1.2.0
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
      
    - name: Push Package to NuGet.org
      run: nuget push nf.Tarantool.${{env.NBGV_NuGetPackageVersion}}.nupkg -ApiKey ${{steps.login.outputs.NUGET_API_KEY}} -src https://api.nuget.org/v3/index.json
